name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.10 is the floor nesting_depth.py documents (ast.Match).
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Skills and nesting_depth.py (unittest)
        run: python3 -m unittest discover -s tests -v

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install Claude Code
        run: npm i -g @anthropic-ai/claude-code@2.1.309 # bump deliberately, after validating locally
      - name: Validate plugin and marketplace
        run: |
          claude plugin validate --strict plugins/principles
          claude plugin validate --strict .
